<style>

html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}

p{margin:0;line-height:1.45}

const NKINDS=[['hot','🔥 Spots heating up near you'],['friends','👥 Friends going out'],['chats','💬 Hi\'s back, messages, chats fading'],['plans','📅 Plans starting soon'],['photos','✅ Photo approvals']];
const IS_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent), IS_STANDALONE=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const swReady=()=>Promise.race([navigator.serviceWorker.ready, new Promise(r=>setTimeout(()=>r(null),4000))]);
const b64u=x=>{ const r=atob((x+'='.repeat((4-x.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(r,c=>c.charCodeAt(0)); };
if('serviceWorker' in navigator) navigator.serviceWorker.register('/app/sw.js',{ scope:'/app/' }).catch(()=>{});
async function pushOn(){
  try{ const perm=await Notification.requestPermission(); if(perm!=='granted'){ drawNotify(); return; }
    const { data:key } = await SB.rpc('push_public_key'); if(!key) throw new Error('Notifications are not ready yet. Try again in a minute.');
    const reg=await swReady(); if(!reg) throw new Error('Could not start notifications. Close MIRL, open it again, and retry.');
    let sub=await reg.pushManager.getSubscription(); if(!sub) sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64u(key) });
    const j=sub.toJSON(); const { error } = await SB.rpc('save_push_sub',{ p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth }); if(error) throw error;
    toast('Notifications on'); SB.rpc('push_test'); drawNotify();
  }catch(e){ toast(e.message||'Could not turn on notifications'); }
}
async function drawNotify(){
  const box=document.getElementById('ntf'); if(!box) return;
  const can='serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  if(!can){ box.innerHTML = IS_IOS&&!IS_STANDALONE
      ? '<p style="font-weight:600">Add MIRL to your home screen first</p><p class="small muted">On iPhone, notifications only work from the home-screen app. Tap Share, then Add to Home Screen, then open MIRL from that icon.</p>'
      : '<p class="small muted">This browser can\'t show notifications. Try Chrome or Safari.</p>'; return; }
  let sub=null; try{ const reg=await swReady(); if(reg) sub=await reg.pushManager.getSubscription(); }catch{}
  if(!document.body.contains(box)) return;
  const on=!!sub && Notification.permission==='granted', pref=S.profile.notify||{};
  if(on){ const j=sub.toJSON(); SB.rpc('save_push_sub',{ p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth }); }
  box.innerHTML = on
    ? `<div class="row between"><p style="font-weight:600">Notifications on</p><button class="btn sm" id="ntest" style="width:auto">Send a test</button></div>
       ${NKINDS.map(([k,l])=>`<div class="row between" style="margin-top:10px"><p class="small">${l}</p><button class="switch" data-nk="${k}" role="switch" aria-checked="${pref[k]!==false}" aria-label="${esc(l)}"></button></div>`).join('')}
       <button class="back small" id="noff" style="margin-top:12px">Turn off on this phone</button>`
    : `<p style="font-weight:600">Get a heads-up when a spot near you heats up</p><p class="small muted" style="margin:4px 0 10px">Pick what pings you.</p>`
      + (Notification.permission==='denied' ? '<p class="small" style="color:var(--gold)">Notifications are blocked for MIRL in your phone settings. Turn them on there, then come back.</p>' : '<button class="btn gold" id="non">Turn on notifications</button>');
  document.getElementById('non')?.addEventListener('click', pushOn);
  document.getElementById('ntest')?.addEventListener('click', async()=>{ await SB.rpc('push_test'); toast('Test sent. It should pop up in a few seconds.'); });
  document.getElementById('noff')?.addEventListener('click', async()=>{ try{ await SB.rpc('drop_push_sub',{ p_endpoint:sub.endpoint }); await sub.unsubscribe(); }catch{} toast('Notifications off on this phone'); drawNotify(); });
  box.querySelectorAll('[data-nk]').forEach(b=>b.onclick=async()=>{ const v=b.getAttribute('aria-checked')!=='true'; b.setAttribute('aria-checked',v);
    const n=Object.assign({}, S.profile.notify||{}, { [b.dataset.nk]:v }); S.profile.notify=n; await SB.from('profiles').update({ notify:n }).eq('id',S.user.id); });
}
async function boot(){
  { const h=location.hash.slice(1); if(['map','discover','plans','chats','me'].includes(h)){ S.tab=h; document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current', b.dataset.tab===h?'page':'false')); history.replaceState(null,'',location.pathname+location.search); } }
  await Promise.race([AVA_P, new Promise(r=>setTimeout(r,4000))]);
  const { data:{ session } } = await SB.auth.getSession();
  S.user = session?.user || null;
  SB.auth.onAuthStateChange((_e, s)=>{ const was=S.user?.id; S.user=s?.user||null; if(was!==S.user?.id) loadProfile(); });
  await loadProfile();
}
async function loadProfile(){
  if(!S.user){ S.profile=null; return render(); }
  const { data } = await SB.from('profiles').select('*').eq('id', S.user.id).maybeSingle();
  S.profile = data; render(); markReview(); autoPing();
}
function render(){
  if(S.chan){ SB.removeChannel(S.chan); S.chan=null; }
  document.getElementById('tabs').hidden = !(S.user && S.profile);
  if(!S.user) return renderWelcome();
  if(!S.profile) return renderOnboard();
  if(!S.profile.handle){ S.tab='me'; return renderMe(true); }
  ({map:renderMap, discover:renderDiscover, plans:renderPlans, chats:renderChats, me:renderMe})[S.tab]();
  refreshBadges(); if(pendingJoin()) setTimeout(handleJoin,0);
}
// ---------- tab badges: unread chats + friend requests, plans in the next 24h ----------
let bdgT;
async function refreshBadges(){ clearTimeout(bdgT); bdgT=setTimeout(async()=>{ if(!S.user||!S.profile) return;
  const { data } = await SB.rpc('my_badges'); const b=(data||[])[0]||{};
  [['chats',b.chats],['plans',b.plans]].forEach(([t,n])=>{ const btn=document.querySelector(`nav.tabs button[data-tab=${t}]`); if(!btn) return;
    let el=btn.querySelector('.bdg'); if(!n){ el?.remove(); return; } if(!el){ el=document.createElement('span'); el.className='bdg'; btn.appendChild(el); } el.textContent=n>99?'99+':n; });
  const n=(b.chats||0)+(b.plans||0);
  if(navigator.setAppBadge){ try{ n?navigator.setAppBadge(n):navigator.clearAppBadge(); }catch{} }
  try{ const c=await caches.open('mirl-badge'); await c.put('/app/badge-count', new Response(String(n))); }catch{} },150); }
setInterval(()=>{ if(document.visibilityState==='visible') refreshBadges(); }, 45000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') refreshBadges(); });

    document.querySelector('.hero h1').insertAdjacentHTML('beforebegin', `<div class="card" style="border-color:var(--gold)"><p class="small muted">🎟️ You're invited</p><p style="font-weight:700;font-size:20px;margin:4px 0">${j.by?'@'+esc(j.by):pl.official?esc(pl.host):'@'+esc(pl.host)} invited you to ${esc(pl.title)}</p><p class="small">📍 ${esc(pl.venue)} · ${esc(d)} · ${pl.going} going</p></div>`);
    const g=document.getElementById('g'); g.textContent="I'm in. Join MIRL to RSVP"; g.insertAdjacentHTML('afterend','<p class="small muted" style="text-align:center;margin-top:-6px">Free. 18+. Your name stays private until you choose to share it.</p>'); }); }

// ---------- onboarding ----------
function renderOnboard(){
  const meta = S.user.user_metadata||{};
  const first = (meta.full_name||meta.name||'').split(' ')[0];
  const st = { mode:'both', picked:{}, icon:ICONS[Math.floor(Math.random()*ICONS.length)], color:COLORS[0] };
  $app.innerHTML = `<div class="screen">
    <h1>Welcome to MIRL</h1>
    <p class="muted">A few basics. Only your first name and age are ever shown, and only inside the same spot.</p>
    <label class="f">First name<input type="text" id="fn" maxlength="40" value="${esc(first)}" autocomplete="given-name"></label>
    <label class="f">Birthday (must be 18+)<input type="date" id="bd" max="${new Date(Date.now()-18*365.25*864e5).toISOString().slice(0,10)}"></label>
    ${idBlock('',st.icon,st.color)}
    <h2>I'm looking for</h2>
    <div class="seg" id="mode"><button data-v="dating" aria-pressed="false">Dating</button><button data-v="both" aria-pressed="true">Open to both</button><button data-v="friends" aria-pressed="false">Friends</button></div>
    <label class="f">I am<select id="gender"><option value="">Choose…</option><option value="woman">Woman</option><option value="man">Man</option><option value="trans woman">Trans woman</option><option value="trans man">Trans man</option><option value="nonbinary">Nonbinary</option><option value="genderfluid">Genderfluid / genderqueer</option><option value="self">Let me type it</option><option value="private">Prefer not to say</option></select></label>
    <label class="f" id="gselfwrap" hidden>In your words<input type="text" id="gself" maxlength="30" placeholder="How you describe yourself"></label>
    <label class="f">Show me<select id="show"><option value="">Everyone</option><option value="w">Women</option><option value="m">Men</option><option value="nb">Nonbinary people</option><option value="w,nb">Women + nonbinary</option><option value="m,nb">Men + nonbinary</option></select></label>
    <h2>Tap what you're into</h2>
    <div class="chips" id="chips">${INTERESTS.map(i=>`<button class="chip" aria-pressed="false">${esc(i)}</button>`).join('')}</div>
    <label class="row small muted" style="gap:10px"><input type="checkbox" id="terms" style="width:20px;height:20px">I'm 18 or older and agree to be respectful. Block and report are always one tap away.</label>
    <div class="err" id="err"></div>
    <button class="btn gold" id="save">Save and see the map</button>
  </div>`;
  document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{ st.mode=b.dataset.v; document.querySelectorAll('#mode button').forEach(x=>x.setAttribute('aria-pressed', x===b)); });
  wireId(st);
  document.getElementById('gender').onchange=e=>{ document.getElementById('gselfwrap').hidden = e.target.value!=='self'; };
  document.querySelectorAll('#chips .chip').forEach(b=>b.onclick=()=>{ const on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',on); st.picked[b.textContent]=on; });
  document.getElementById('save').onclick = async ()=>{
    const err=document.getElementById('err');
    const fn=document.getElementById('fn').value.trim(), bd=document.getElementById('bd').value;
    if(!fn) return err.textContent='Add your first name.';
    if(!bd) return err.textContent='Add your birthday.';
    if((Date.now()-new Date(bd))/(365.25*864e5) < 18) return err.textContent='MIRL is 18+ only.';
    const hc=await checkHandle(); if(hc.err) return err.textContent=hc.err;
    if(!document.getElementById('terms').checked) return err.textContent='Please check the box to continue.';
    const show=document.getElementById('show').value;
    const GROUPS={ w:['woman','trans woman'], m:['man','trans man'], nb:['nonbinary','genderfluid'] };
    const showG = show ? show.split(',').flatMap(k=>GROUPS[k]) : [];
    let g=document.getElementById('gender').value;
    if(g==='self') g=document.getElementById('gself').value.trim().toLowerCase()||null;
    if(g==='private') g=null;
    const row={ id:S.user.id, first_name:fn, birth_date:bd, mode:st.mode, gender:g||null, handle:hc.h, avatar_icon:st.icon, avatar_color:st.color,
      show_genders: showG, interests:Object.keys(st.picked).filter(k=>st.picked[k]), avatar_url: meta.avatar_url||meta.picture||null };
    const { error } = await SB.from('profiles').insert(row);
    if(error) return err.textContent = error.message.includes('account_not_allowed') ? "This account can't use MIRL. Questions: hello@gomirl.com" : error.message.includes('birth_date') ? 'MIRL is 18+ only.' : 'Could not save: '+error.message;
    toast('Welcome to MIRL'); loadProfile();
  };
}

// ---------- map ----------
async function renderMap(){
  let view=null; try{ view=JSON.parse(localStorage.getItem('mirl_view')||'null'); }catch{}
  const DELRAY=[26.4616,-80.0685];
  $app.innerHTML = `<div class="screen">
    <div class="row between"><div class="row" style="gap:12px"><img class="brandlogo" src="/app/logo.png?v=2" alt="MIRL" style="width:96px"><div><p class="small muted" id="area">Near you</p><h1>Tonight</h1></div></div>
      <span class="small muted">${S.profile.ghost_mode?'Ghost Mode on':'Friends can see your spot'}</span></div>
    <div id="feat"></div>
    <div><input type="text" id="sq" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="🔎 Find a spot: bar, café, park…" aria-label="Find a spot" style="font-size:17px;border-color:var(--gold)">
      <div id="ssug" class="list" style="margin-top:8px"></div></div>
    <div style="position:relative">
      <div id="map" role="region" aria-label="Map of spots"></div>
      <div id="xhair" hidden style="position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border:3px solid var(--gold);border-radius:50%;z-index:900;pointer-events:none;box-shadow:0 0 0 3px rgba(0,0,0,.4)"></div>
      <button class="btn sm" id="nearme" style="position:absolute;right:10px;bottom:10px;z-index:900;background:var(--surface);width:auto">📍 Near me</button>
    </div>
    <p class="small muted" id="mapmsg">Numbers = people at a spot. Purple glow = 3+ around. ${tip("You see who's inside a spot once you're there too, and only as avatars and handles.")}</p>
    <div id="addbox"></div>
    <button class="btn" id="addspot">+ Add a missing spot</button>
    <div id="tonightw" hidden><h2>Tonight's plans</h2><div class="list" id="tlist"></div></div>
    <h2>Spots</h2><div class="list" id="vlist"><p class="small muted">Loading spots…</p></div>
  </div>`;
  const el=document.getElementById('map');
  S.map = L.map(el,{zoomControl:false,attributionControl:true}).setView(view?[view.lat,view.lng]:DELRAY, view?.z||16);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(S.map);
  const glow=L.layerGroup().addTo(S.map), layer=L.layerGroup().addTo(S.map);
  S.osmCache = S.osmCache || {};
  let tmr, seq=0;
  const load=async()=>{
    const my=++seq, b=S.map.getBounds(), z=S.map.getZoom(), c=S.map.getCenter();
    try{ localStorage.setItem('mirl_view', JSON.stringify({lat:c.lat,lng:c.lng,z})); }catch{}
    const inDelray = Math.abs(c.lat-DELRAY[0])<0.03 && Math.abs(c.lng-DELRAY[1])<0.04;
    document.getElementById('area').textContent = inDelray ? 'Atlantic Ave · Delray Beach · launch zone' : 'Near you';
    const box={ s:b.getSouth(), w:b.getWest(), n:b.getNorth(), e:b.getEast() };
    const [{ data:dbv }, { data:feat }, { data:fc }, { data:act }, { data:tp }] = await Promise.all([SB.rpc('venue_counts_area',box), SB.rpc('featured_plan_area',box), SB.rpc('friend_counts'), SB.rpc('area_activity',box), SB.rpc('plans_tonight_area',box)]);
    if(my!==seq) return;
    // tonight's plans: one per spot on its pin (most going), all of them in a list under the map
    const TP={}; (tp||[]).forEach(x=>{ if(!TP[x.venue_id]) TP[x.venue_id]=x; });
    const hm=t=>new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}).replace(':00','').replace(' ','').toLowerCase();
    { const tw=document.getElementById('tonightw'), tl=document.getElementById('tlist');
      if(tw&&tl){ tw.hidden=!(tp||[]).length;
        tl.innerHTML=(tp||[]).map((x,i)=>`<button class="item" data-tp="${i}"><div style="flex:1;min-width:0"><p style="font-weight:600">${esc(x.title)}${x.official?'<span class="ptag">📣 Official</span>':''}${x.weekly?'<span class="ptag">🔁 Weekly</span>':''}</p><p class="small muted">${esc(x.venue)} · ${hm(x.starts_at)}</p></div><span class="small" style="color:var(--gold);font-weight:600;white-space:nowrap">${x.im_going?'✓ ':''}${x.going} going</span></button>`).join('');
        tl.querySelectorAll('[data-tp]').forEach(b=>b.onclick=()=>openPlan(tp[+b.dataset.tp].plan_id)); } }
    glow.clearLayers();
    (act||[]).forEach(a=>{ const n=a.people, lab=n>=20?'20+':n>=10?'10+':n>=5?'5+':'3+';
      L.circle([a.lat,a.lng],{ radius:190, stroke:false, fillColor:'#7B78FF', fillOpacity:Math.min(.5,.16+n*.02), interactive:true })
        .bindTooltip(lab+' members around', { direction:'top' }).addTo(glow); });
    const FC={}; (fc||[]).forEach(r=>FC[r.venue_id]=r.friends_here);
    let list=(dbv||[]).map(v=>({...v, friends_here:FC[v.venue_id]||0}));
    const sortL=l=>l.sort((a,b)=>(b.members_here||0)-(a.members_here||0) || (b.friends_here||0)-(a.friends_here||0) || a.name.localeCompare(b.name));
    sortL(list); S.venues=list;
    const draw=list=>{
      if(!document.getElementById('vlist')) return;
      const featEl=document.getElementById('feat');
    if(feat && feat[0]){ const f=feat[0], w=when(f.starts_at);
      featEl.innerHTML=`<button class="item" style="background:var(--gold);color:var(--bg);border-color:var(--gold)" id="featb">
        <div class="date" style="color:var(--bg)"><span>${w.day}</span><b>${w.time}</b></div>
        <div style="flex:1"><p class="small" style="font-weight:600;letter-spacing:.06em">MOST POPULAR PLAN NEARBY</p><p style="font-family:var(--display);font-size:19px;font-weight:700">${esc(f.title)}</p><p class="small">${esc(f.venue)} · ${f.going} going</p></div></button>`;
      document.getElementById('featb').onclick=()=>openPlan(f.plan_id);
    } else featEl.innerHTML='';
    layer.clearLayers();
    list.forEach((v,i)=>{
      const n=v.members_here, pl=v.venue_id&&TP[v.venue_id], cls=(n>=15?'pin hot':n>=5?'pin warm':'pin')+(pl?' hasplan':'');
      const icon=L.divIcon({className:'',html:`<div class="${cls}">${n?n+' · ':''}${esc(v.name)}${v.friends_here?' · 👥'+v.friends_here:''}${pl?`<span class="pplan">${pl.official?'📣 ':''}${esc(pl.title.length>26?pl.title.slice(0,25)+'…':pl.title)} · ${hm(pl.starts_at)}</span>`:''}</div>`,iconSize:null});
      L.marker([v.lat,v.lng],{icon}).addTo(layer).on('click',()=>goVenue(v));
    });
    const vl=document.getElementById('vlist');
    vl.innerHTML = list.length ? list.slice(0,60).map((v,i)=>`<button class="item" data-i="${i}">
       <div style="flex:1"><p style="font-weight:600">${esc(v.name)}</p>${v.category?`<p class="small muted">${esc(v.category)}</p>`:''}</div>
       <span class="small ${v.members_here?'':'muted'}">${v.members_here?v.members_here+' here':'Quiet'}${v.friends_here?` · <b style="color:var(--green)">${v.friends_here} friend${v.friends_here>1?'s':''}</b>`:''}</span></button>`).join('')
      : `<p class="small muted">${z<15?'Zoom in to see spots.':'No spots here yet. Add one below the map.'}</p>`;
    vl.querySelectorAll('.item').forEach(b=>b.onclick=()=>goVenue(list[+b.dataset.i]));
      };
    draw(list);
    // OpenStreetMap places not saved yet, loaded in the background (zoomed in only)
    if(z>=15){
      const key=[box.s,box.w,box.n,box.e].map(x=>x.toFixed(3)).join(',');
      let osm=S.osmCache[key];
      if(!osm){
        const q=`[out:json][timeout:12];(nwr["amenity"~"^(bar|pub|nightclub|restaurant|cafe|biergarten)$"]["name"](${box.s},${box.w},${box.n},${box.e}););out center 300;`;
        const ask=host=>{ const ctl=new AbortController(); setTimeout(()=>ctl.abort(),15000);
          return fetch(host,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctl.signal})
            .then(r=>r.ok?r.json():Promise.reject(r.status)).then(j=>j.elements?j:Promise.reject('bad')); };
        try{ const j=await Promise.any(['https://overpass.private.coffee/api/interpreter','https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'].map(ask));
          osm=(j.elements||[]).map(x=>({ osm_id:x.type[0]+x.id, name:x.tags.name, category:x.tags.amenity, address:[x.tags['addr:housenumber'],x.tags['addr:street']].filter(Boolean).join(' ')||null, lat:x.lat??x.center?.lat, lng:x.lon??x.center?.lon })).filter(x=>x.lat&&x.lng);
          S.osmCache[key]=osm; }catch{}
      }
      if(my!==seq || !osm) return;
      const have=new Set(list.map(v=>v.osm_id).filter(Boolean));
      const more=osm.filter(o=>!have.has(o.osm_id)).map(o=>({...o, venue_id:null, members_here:null, friends_here:0, is_public:true}));
      if(more.length){ list=sortL(list.concat(more)); S.venues=list; draw(list); }
    }
  };
  S.map.on('moveend',()=>{ clearTimeout(tmr); tmr=setTimeout(load,350); });
  load();
  // find-a-spot box: instant matches from what's on the map, then MIRL + OpenStreetMap search
  { const sq=document.getElementById('sq'), sg=document.getElementById('ssug'); let st, sseq=0;
    const show=items=>{ sg.innerHTML=items.map((v,i)=>`<button class="item" data-i="${i}" style="padding:10px 12px"><div style="flex:1;min-width:0"><p style="font-weight:600">${esc(v.name)}</p><p class="small muted">${esc([v.category,v.address].filter(Boolean).join(' · ')||'')}</p></div>${v.members_here?`<span class="small">${v.members_here} here</span>`:''}</button>`).join('');
      sg.querySelectorAll('.item').forEach(b=>b.onclick=()=>{ const v=items[+b.dataset.i]; sq.value=''; sg.innerHTML=''; sq.blur(); if(v.lat&&v.lng) S.map.setView([v.lat,v.lng],17); goVenue(v); }); };
    sq.oninput=()=>{ clearTimeout(st); const q=sq.value.trim().toLowerCase(); if(!q){ sg.innerHTML=''; return; }
      const local=(S.venues||[]).filter(v=>v.name.toLowerCase().includes(q)).slice(0,6); show(local);
      if(q.length<2) return;
      st=setTimeout(async()=>{ const my=++sseq, c=S.map.getCenter();
        const [loc, osm] = await Promise.all([
          SB.rpc('search_venues',{ q, p_lat:c.lat, p_lng:c.lng }).then(r=>(r.data||[]).map(v=>({ venue_id:v.id, osm_id:v.osm_id, name:v.name, category:v.category, address:v.address, lat:v.lat, lng:v.lng, is_public:true }))).catch(()=>[]),
          q.length<3 ? Promise.resolve([]) : fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lat=${c.lat}&lon=${c.lng}&limit=8&lang=en`).then(r=>r.json()).then(j=>(j.features||[])
            .filter(f=>f.properties.name && /^(amenity|leisure|tourism|shop|club|sport)$/.test(f.properties.osm_key))
            .map(f=>({ venue_id:null, osm_id:String(f.properties.osm_type||'n').toLowerCase()[0]+f.properties.osm_id, name:f.properties.name, category:(f.properties.osm_value||'').replace(/_/g,' '),
               address:[[f.properties.housenumber,f.properties.street].filter(Boolean).join(' '), f.properties.city].filter(Boolean).join(', ')||null, lat:f.geometry.coordinates[1], lng:f.geometry.coordinates[0], members_here:null, friends_here:0, is_public:true }))).catch(()=>[])
        ]);
        if(my!==sseq || sq.value.trim().toLowerCase()!==q) return;
        const out=[...local];
        const dup=v=>out.some(o=>(v.venue_id&&o.venue_id===v.venue_id)||(v.osm_id&&o.osm_id===v.osm_id)||(o.name.toLowerCase()===v.name.toLowerCase()&&Math.abs(o.lat-v.lat)<0.001&&Math.abs(o.lng-v.lng)<0.001));
        loc.concat(osm).forEach(v=>{ if(!dup(v)) out.push(v); });
        if(!out.length){ sg.innerHTML='<p class="small muted">No matches yet. Keep typing, or add it with "+ Add a missing spot".</p>'; return; }
        show(out.slice(0,8)); },300); };
  }
  document.getElementById('nearme').onclick=()=>{
    if(!navigator.geolocation) return toast('Location is not available on this device.');
    navigator.geolocation.getCurrentPosition(p=>{ pingArea(p); S.map.setView([p.coords.latitude,p.coords.longitude],16); }, ()=>toast('Allow location to center the map. It stays on your phone.'), { timeout:10000 });
  };
  // add a missing spot
  document.getElementById('addspot').onclick=()=>{
    if(S.map.getZoom()<16) S.map.setZoom(17);
    document.getElementById('xhair').hidden=false; document.getElementById('addspot').hidden=true;
    const box=document.getElementById('addbox');
    box.innerHTML=`<div class="card" style="display:flex;flex-direction:column;gap:10px">
      <p style="font-weight:600">Move the map so the gold circle is on the spot</p>
      <label class="f">Name<input type="text" id="an" maxlength="80" placeholder="e.g. Joe's Tiki Bar"></label>
      <label class="f">Type<select id="ac"><option value="bar">Bar</option><option value="restaurant">Restaurant</option><option value="nightclub">Club</option><option value="cafe">Cafe</option><option value="event_space">Event space</option><option value="other">Other public place</option></select></label>
      <div id="near"></div><div class="err" id="aerr"></div>
      <div class="row"><button class="btn" id="acancel">Cancel</button><button class="btn gold" id="asave">Add spot</button></div>
      <p class="small muted">Public places only. New spots work for check-ins right away; plans open once we review them.</p></div>`;
    const close=()=>{ box.innerHTML=''; document.getElementById('xhair').hidden=true; document.getElementById('addspot').hidden=false; };
    document.getElementById('acancel').onclick=close;
    let confirmed=false;
    document.getElementById('asave').onclick=async()=>{
      const name=document.getElementById('an').value.trim(), cat=document.getElementById('ac').value, c=S.map.getCenter(), err=document.getElementById('aerr');
      if(name.length<2) return err.textContent='Give the spot a name.';
      if(!confirmed){
        const { data:nb } = await SB.rpc('venues_near',{ p_lat:c.lat, p_lng:c.lng });
        const osmNear=(S.venues||[]).filter(v=>!v.venue_id && dist(c.lat,c.lng,v.lat,v.lng)<=100).map(v=>({ name:v.name, meters:Math.round(dist(c.lat,c.lng,v.lat,v.lng)), v }));
        const all=[...(nb||[]).map(x=>({ name:x.name, meters:x.meters, id:x.venue_id })), ...osmNear].sort((a,b)=>a.meters-b.meters).slice(0,6);
        if(all.length){ confirmed=true;
          document.getElementById('near').innerHTML=`<p class="small" style="font-weight:600">Is it one of these?</p><div class="list" style="margin-top:6px">${all.map((x,i)=>`<button class="item" data-k="${i}"><div style="flex:1">${esc(x.name)}</div><span class="small muted">${x.meters} m</span></button>`).join('')}</div><p class="small muted" style="margin-top:6px">Not listed? Tap Add spot again.</p>`;
          document.querySelectorAll('#near .item').forEach(b=>b.onclick=()=>{ const x=all[+b.dataset.k]; close(); x.id?openVenue(x.id):goVenue(x.v); });
          return; }
      }
      const { data:id, error } = await SB.rpc('add_venue',{ p_name:name, p_cat:cat, p_lat:c.lat, p_lng:c.lng });
      if(error) return err.textContent=error.message;
      close(); toast('Spot added'); S.osmCache={}; await load(); openVenue(id);
    };
  };
}
async function goVenue(v){
  if(!v.venue_id){
    const { data:id, error } = await SB.rpc('save_osm_venue',{ p_osm:v.osm_id, p_name:v.name, p_cat:v.category||null, p_addr:v.address||null, p_lat:v.lat, p_lng:v.lng });
    if(error) return toast('Could not open this spot');
    v.venue_id=id;
  }
  openVenue(v.venue_id);
}

// ---------- venue ----------
async function openVenue(id){
  const v = S.venues.find(x=>x.venue_id===id) || (await SB.from('venues').select('id,name,lat,lng,is_public').eq('id',id).single()).data;
  const vid = v.venue_id||v.id;
  const now=new Date(), wk=new Date(Date.now()+7*864e5);
  const { data:plans } = await SB.from('plans').select('id,title,starts_at,visibility').eq('venue_id',vid).gte('starts_at', new Date(Date.now()-6*36e5).toISOString()).lte('starts_at',wk.toISOString()).order('starts_at');
  document.getElementById('tabs').hidden=false;
  $app.innerHTML = `<div class="screen">
    <button class="back" id="bk">‹ Back to map</button>
    <h1>${esc(v.name)}</h1>
    <div class="card"><p style="font-family:var(--display);font-size:30px;font-weight:700;color:var(--gold)">${v.members_here||0}</p><p class="small muted">members inside now${v.friends_here?` · <b style="color:var(--green)">${v.friends_here} of your friends</b>`:''}</p></div>
    <button class="btn gold" id="ci">I'm here · check in</button>
    <p class="small muted">Uses your location once, only to confirm you're at ${esc(v.name)}. You're checked out when you leave or after 3 hours.</p>
    <div class="err" id="err"></div>
    <h2>Plans here this week</h2>
    <div class="list" id="pl">${(plans||[]).length? plans.map(p=>{const w=when(p.starts_at); return `<button class="item" data-id="${p.id}"><div class="date"><span>${w.day}</span><b>${w.time}</b></div><div style="flex:1"><p style="font-weight:600">${esc(p.title)}</p><p class="small muted">${p.visibility==='open'?'Open':'Invite-only'}</p></div></button>`}).join('') : '<p class="small muted">No plans yet. Start one.</p>'}</div>
    ${v.is_public===false?'<p class="small muted">New spot added by a member. Plans open here once it\'s reviewed.</p>':'<button class="btn" id="np">+ Start a plan here</button>'}
    <p class="small muted">Listing from public map data. Own ${esc(v.name)}? Email hello@gomirl.com to claim it free.</p>
  </div>`;
  document.getElementById('bk').onclick=()=>setTab('map');
  const npb=document.getElementById('np'); if(npb) npb.onclick=()=>newPlan(vid, v.name);
  document.querySelectorAll('#pl .item').forEach(b=>b.onclick=()=>openPlan(b.dataset.id));
  document.getElementById('ci').onclick=()=>{
    const err=document.getElementById('err'); err.textContent='Checking your location…';
    if(!navigator.geolocation) return err.textContent='Location is not available on this device.';
    const iOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
    const fail=e=>{
      if(e.code===1) err.innerHTML = iOS
        ? 'Location is blocked for this browser. On iPhone: <b>Settings → Privacy & Security → Location Services</b> (on) → <b>Safari Websites</b> (or Chrome) → <b>While Using</b>. Then reload this page and tap check in again.'
        : 'Location is blocked. Tap the lock icon by the web address, allow Location, then tap check in again.';
      else err.textContent='Could not get your location (weak signal indoors?). Step near a door or window and tap check in again.';
    };
    const go=async pos=>{
      pingArea(pos);
      const d=dist(pos.coords.latitude,pos.coords.longitude,v.lat,v.lng);
      const acc=pos.coords.accuracy||0, allowed=Math.min(250, CHECKIN_RADIUS_M + Math.min(acc,150));
      if(d > allowed) return err.textContent = acc>150
        ? `Your GPS is weak in here (about ${Math.round(acc*3.28)} feet off). Step outside or near the door for a few seconds and tap check in again.`
        : `You look about ${d>=800?(d/1609).toFixed(d>=16090?0:1)+' miles':Math.round(d*3.28)+' feet'} away. Check-in only works once you're at the spot.`;
      const { error } = await SB.rpc('check_in',{ venue: vid, p_lat:pos.coords.latitude, p_lng:pos.coords.longitude, p_acc:acc });
      if(error) return err.textContent = /too_far/.test(error.message) ? 'You look a little too far away. Step inside or near the door and tap check in again.' : 'Could not check in: '+error.message;
      err.textContent=''; toast('Checked in'); openInside(vid, v.name, v.lat, v.lng);
    };
    navigator.geolocation.getCurrentPosition(go, e=>{
      if(e.code===1) return fail(e);
      navigator.geolocation.getCurrentPosition(go, fail, { enableHighAccuracy:false, timeout:20000, maximumAge:120000 });  // retry, faster/coarser
    }, { enableHighAccuracy:true, timeout:12000, maximumAge:60000 });
  };
}

function newPlan(vid, vname){
  const def=new Date(Date.now()+864e5); def.setHours(21,0,0,0);
  const local=new Date(def-def.getTimezoneOffset()*6e4).toISOString().slice(0,16);
  let vis='open';
  $app.innerHTML = `<div class="screen">
    <button class="back" id="bk">‹ Back</button>
    <h1>Start a plan</h1>
    ${vid?`<p class="muted">at ${esc(vname)}</p>`:`<label class="f">Where<input type="text" id="vq" autocomplete="off" placeholder="Start typing a bar, restaurant, park…"></label>
      <div class="list" id="vsug" style="gap:6px;margin-top:-6px"></div><p class="small" id="vpick" style="color:var(--green)"></p>`}
    <label class="f">What<input type="text" id="ti" maxlength="80" placeholder="Salsa night, beginners welcome"></label>

    <p class="small muted" id="vnote">Shows on the map to members who fit your settings.</p>
    <div class="card row between"><div><p style="font-weight:600">Repeat every week</p><p class="small muted">For a weekly trivia, karaoke or music night</p></div><button class="switch" id="rw" role="switch" aria-checked="false" aria-label="Repeat every week"></button></div>
    <div id="tagw" hidden><p style="font-weight:600;margin-bottom:6px">Tag friends <span class="small muted" style="font-weight:400">· they get an invite</span></p><div class="chips" id="tagf"></div></div>
    <div class="err" id="err"></div>
    <button class="btn violet" id="go">Post plan</button>
    
  </div>`;
  document.getElementById('bk').onclick=()=> vid?openVenue(vid):setTab('plans');
  let picked=null;
  if(!vid){
    let view=null; try{ view=JSON.parse(localStorage.getItem('mirl_view')||'null'); }catch{}
    const lat=view?.lat||26.4616, lng=view?.lng||-80.0685;
    const vq=document.getElementById('vq'), sug=document.getElementById('vsug'), vp=document.getElementById('vpick'); let tmr, seq=0;
    const show=items=>{ sug.innerHTML=items.map((v,i)=>`<button class="item" data-i="${i}" style="padding:10px 12px"><div style="flex:1;min-width:0"><p style="font-weight:600">${esc(v.name)}</p><p class="small muted">${esc([v.category,v.address].filter(Boolean).join(' · ')||'')}</p></div>${v.venue_id?'<span class="small" style="color:var(--violet)">On MIRL</span>':''}</button>`).join('');
      sug.querySelectorAll('.item').forEach(b=>b.onclick=()=>{ picked=items[+b.dataset.i]; vq.value=picked.name; sug.innerHTML=''; vp.textContent='📍 '+picked.name+(picked.address?' · '+picked.address:''); }); };
    const nearby=(S.venues||[]).filter(v=>v.is_public!==false).slice(0,5); if(nearby.length) show(nearby);
    vq.oninput=()=>{ picked=null; vp.textContent=''; clearTimeout(tmr); const q=vq.value.trim(); if(q.length<2){ show(nearby); return; }
      tmr=setTimeout(async()=>{ const my=++seq;
        const [loc, osm] = await Promise.all([
          SB.rpc('search_venues',{ q, p_lat:lat, p_lng:lng }).then(r=>(r.data||[]).map(v=>({ venue_id:v.id, osm_id:v.osm_id, name:v.name, category:v.category, address:v.address, lat:v.lat, lng:v.lng }))).catch(()=>[]),
          q.length<3 ? Promise.resolve([]) : fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lat=${lat}&lon=${lng}&limit=8&lang=en`).then(r=>r.json()).then(j=>(j.features||[])
            .filter(f=>f.properties.name && /^(amenity|leisure|tourism|shop|club|sport)$/.test(f.properties.osm_key))
            .map(f=>({ venue_id:null, osm_id:String(f.properties.osm_type||'n').toLowerCase()[0]+f.properties.osm_id, name:f.properties.name, category:(f.properties.osm_value||'').replace(/_/g,' '),
               address:[[f.properties.housenumber,f.properties.street].filter(Boolean).join(' '), f.properties.city].filter(Boolean).join(', ')||null, lat:f.geometry.coordinates[1], lng:f.geometry.coordinates[0] }))).catch(()=>[])
        ]);
        if(my!==seq) return;
        const have=new Set(loc.map(v=>v.osm_id).filter(Boolean)), out=loc.concat(osm.filter(o=>!have.has(o.osm_id) && !loc.some(l=>l.name.toLowerCase()===o.name.toLowerCase() && Math.abs(l.lat-o.lat)<0.001 && Math.abs(l.lng-o.lng)<0.001))).slice(0,8);
        if(!out.length){ sug.innerHTML='<p class="small muted">No matches yet. Keep typing, or add the spot from the map.</p>'; return; }

  }

    c.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ const on=!tagged.has(b.dataset.f); on?tagged.add(b.dataset.f):tagged.delete(b.dataset.f); b.setAttribute('aria-pressed',on); }); });

  document.querySelectorAll('#vis button').forEach(b=>b.onclick=()=>{ vis=b.dataset.v; document.querySelectorAll('#vis button').forEach(x=>x.setAttribute('aria-pressed',x===b)); document.getElementById('vnote').textContent = vis==='open'?'Shows on the map to members who fit your settings.':'Only people you send the link to can see and join.'; });
  document.getElementById('go').onclick=async()=>{
    const err=document.getElementById('err'); const title=document.getElementById('ti').value.trim();
    if(title.length<3) return err.textContent='Give it a short name.';
    let venue_id = vid;
    if(!venue_id){ const sel=picked; if(!sel) return err.textContent='Start typing the spot, then tap it in the list.';
      if(!sel.venue_id){ const { data:id, error:e2 } = await SB.rpc('save_osm_venue',{ p_osm:sel.osm_id, p_name:sel.name, p_cat:sel.category||null, p_addr:sel.address||null, p_lat:sel.lat, p_lng:sel.lng }); if(e2) return err.textContent='Could not use that spot.'; sel.venue_id=id; }
      venue_id=sel.venue_id; }
    const { data, error } = await SB.from('plans').insert({ venue_id, host_id:S.user.id, title, starts_at:new Date(document.getElementById('wh').value).toISOString(), visibility:vis, repeat_weekly:rweek }).select('id,invite_code').single();
    if(error) return err.textContent='Could not post: '+error.message;

    if(tagged.size){ const { data:n } = await SB.rpc('invite_friends',{ pid:data.id, uids:[...tagged] }); if(n) toast(`Invited ${n} friend${n>1?'s':''}`); }
    if(vis==='invite'){ const link=location.origin+location.pathname+'#join='+data.invite_code; try{ await navigator.clipboard.writeText(link); toast('Invite link copied'); }catch{ prompt('Copy your invite link', link); } }
    else toast('Plan posted');
    openPlan(data.id);
  };
}

// ---------- discover: find people to meet (dating or friends), send Meet invites, open plans nearby ----------
let DSC={ mode:null, miles:15 };
function getPos(){ return new Promise((res,rej)=>{ if(!navigator.geolocation) return rej(new Error('Location is not available on this device'));
  navigator.geolocation.getCurrentPosition(p=>res(p.coords), ()=>rej(new Error('Allow location so MIRL can show people nearby')), { enableHighAccuracy:false, timeout:12000, maximumAge:600000 }); }); }
async function renderDiscover(){
  const p=S.profile; if(!DSC.mode) DSC.mode = p.mode==='friends'?'friends':'dating';
  if(!p.discoverable){
    $app.innerHTML=`<div class="screen"><h1>Discover</h1>
      <div class="card"><p style="font-weight:600;font-size:18px">Find people to actually meet 🧭</p>

      <p class="small muted" style="margin-bottom:12px">Only if you turn it on. ${tip('People see your avatar, handle, age, bio, shared interests and a rough distance. Never your name, photos or exact location.')}</p>
      <button class="btn gold" id="don">Show me in Discover</button><p class="err" id="derr"></p></div>
      <div id="dplans"></div></div>`;
    document.getElementById('don').onclick=async()=>{ const e=document.getElementById('derr'); e.textContent='';
      try{ const c=await getPos(); const { error } = await SB.rpc('set_discover',{ on_:true, p_lat:c.latitude, p_lng:c.longitude }); if(error) throw error;
        S.profile.discoverable=true; S.profile.disc_lat=Math.round(c.latitude*100)/100; S.profile.disc_lng=Math.round(c.longitude*100)/100; toast("You're in Discover"); renderDiscover(); }

  }
  const free=p.free_until && new Date(p.free_until)>Date.now();
  $app.innerHTML=`<div class="screen">
    <div class="row between"><h1>Discover</h1><button class="back small" id="doff">Hide me</button></div>

    <div class="row between"><div class="row" style="gap:8px"><span class="small muted">Within</span><select id="dmi" style="width:auto;min-height:38px;padding:4px 10px">${[5,15,30,50].map(m=>`<option value="${m}" ${DSC.miles===m?'selected':''}>${m} mi</option>`).join('')}</select></div>
      <div class="row" style="gap:8px"><span class="small" style="font-weight:600">🌙 Free tonight</span><button class="switch" id="dfree" role="switch" aria-checked="${!!free}" aria-label="I'm free tonight"></button></div></div>
    <div id="dinv"></div>
    <h2>People</h2>
    <div class="list" id="dlist"><p class="small muted">Looking around…</p></div>
    <h2>Open plans nearby</h2>
    <div class="list" id="dplans"><p class="small muted">Loading…</p></div>
  </div>`;
  document.getElementById('doff').onclick=async()=>{ if(!confirm('Hide yourself from Discover? Your pending invites stay.')) return; await SB.rpc('set_discover',{ on_:false, p_lat:null, p_lng:null }); S.profile.discoverable=false; renderDiscover(); };
  document.querySelectorAll('#dmode button').forEach(b=>b.onclick=()=>{ DSC.mode=b.dataset.m; renderDiscover(); });
  document.getElementById('dmi').onchange=e=>{ DSC.miles=+e.target.value; renderDiscover(); };
  document.getElementById('dfree').onclick=async e=>{ const on=e.currentTarget.getAttribute('aria-checked')!=='true'; e.currentTarget.setAttribute('aria-checked',on);
    const { data, error } = await SB.rpc('set_free_tonight',{ on_:on }); if(error) return toast(error.message); S.profile.free_until=data; toast(on?"You're showing as free tonight 🌙":'Free tonight is off'); };
  drawMeetInvites();

    : '<p class="small muted">No open plans nearby this week. Start one from Plans!</p>';
  pb?.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>openPlan(b.dataset.pl));
}
async function drawMeetInvites(){
  const box=document.getElementById('dinv'); if(!box) return; const { data } = await SB.rpc('my_meet_invites'); if(!document.body.contains(box)) return;
  const L=data||[]; if(!L.length){ box.innerHTML=''; return; }
  const inc=L.filter(i=>i.incoming&&i.status==='pending'&&!i.expired), rest=L.filter(i=>!(i.incoming&&i.status==='pending'&&!i.expired));
  const fmt=t=>new Date(t).toLocaleString('en-US',{ weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
  box.innerHTML=(inc.length?`<h2>Invites for you</h2><div class="list">${inc.map(i=>`<div class="card" style="border-color:var(--gold)"><div class="row" style="gap:12px">${av(i.avatar_icon,i.avatar_color,48)}<div style="flex:1;min-width:0"><p style="font-weight:600">@${esc(i.handle)}${i.verified?' <span style="color:var(--green)">✓</span>':''}<span class="muted" style="font-weight:400">, ${i.age} · ${i.mode==='dating'?'💘':'🤝'}</span></p><p class="small">📍 ${esc(i.venue)} · ${fmt(i.starts_at)}</p></div></div>
      ${i.note?`<p style="margin:10px 0 0;font-style:italic">"${esc(i.note)}"</p>`:''}${i.bio?`<p class="small muted" style="margin-top:6px">${esc(i.bio)}</p>`:''}
      <div class="row" style="gap:8px;margin-top:12px"><button class="btn sm gold" data-yes="${i.id}">Yes, let's meet</button><button class="btn sm" data-no="${i.id}">No thanks</button></div></div>`).join('')}</div>`:'')
    + (rest.length?`<h2>Your invites</h2><div class="list">${rest.map(i=>{ const st=i.status==='accepted'?'<span style="color:var(--green)">✓ Going</span>':i.expired?'<span class="muted">No answer</span>':'<span style="color:var(--gold)">Waiting</span>';
        return `<div class="item" ${i.status==='accepted'&&i.plan_id?`data-pl="${i.plan_id}"`:'style="cursor:default"'}>${av(i.avatar_icon,i.avatar_color,40)}<div style="flex:1;min-width:0"><p style="font-weight:600">${i.incoming?'From':'To'} @${esc(i.handle)}</p><p class="small muted">${esc(i.venue)} · ${fmt(i.starts_at)}</p></div><span class="small">${st}</span></div>`; }).join('')}</div>`:'');
  box.querySelectorAll('[data-yes],[data-no]').forEach(b=>b.onclick=async()=>{ const ok=!!b.dataset.yes; b.disabled=true;
    const { data:pid, error } = await SB.rpc('answer_meet_invite',{ p_id:b.dataset.yes||b.dataset.no, ok }); if(error){ b.disabled=false; return toast(error.message); }
    refreshBadges(); if(ok){ toast("It's a plan! Your chat is open 🎉"); openPlan(pid); } else { toast('Declined. They won\'t be told.'); drawMeetInvites(); } });
  box.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>openPlan(b.dataset.pl));
}
async function meetSheet(o){ if(!o) return;

      if(error) return toast(error.message); refreshBadges(); if(ok&&cid){ toast("You're friends now"); openChat(cid); } else renderChats(); });

const REACTS=['👍','👎','❤️','😂','‼️'];
async function openChat(cid){
  const [{ data:msgs }, { data:rx }] = await Promise.all([SB.from('messages').select('*').eq('connection_id',cid).order('created_at'), SB.from('message_reactions').select('message_id,user_id,emoji').eq('connection_id',cid)]);
  const M=new Map((msgs||[]).map(m=>[m.id,m])), R=new Map(); let replyTo=null;
  (rx||[]).forEach(r=>{ if(!R.has(r.message_id)) R.set(r.message_id,new Map()); R.get(r.message_id).set(r.user_id,r.emoji); });
  const snip=t=>(t||'').length>70?t.slice(0,70)+'…':(t||'');
  const msgHTML=m=>{ const q=m.reply_to&&M.get(m.reply_to), rs=R.get(m.id), me=m.sender===S.user.id;
    const counts={}; let mine=null; if(rs) rs.forEach((e,u)=>{ counts[e]=(counts[e]||0)+1; if(u===S.user.id) mine=e; });
    return `<div class="msg ${me?'me':''}" data-id="${m.id}">${q?`<div class="quote">↩ ${q.sender===S.user.id?'You':'Them'}: ${esc(snip(q.body))}</div>`:''}<div class="bubble ${me?'me':''}">${esc(m.body)}</div>${Object.keys(counts).length?`<div class="rx">${REACTS.filter(e=>counts[e]).map(e=>`<span class="${mine===e?'mine':''}">${e}${counts[e]>1?' '+counts[e]:''}</span>`).join('')}</div>`:''}</div>`; };
  $app.innerHTML = `<div class="screen">
    <div class="row between"><button class="back" id="bk">‹ Chats</button><button class="btn sm gold" id="kp">Add friend</button></div>
    <button id="chd" class="item" hidden style="padding:8px 12px"></button>
    <div id="cph" class="row" style="gap:8px;overflow-x:auto" hidden></div>
    <div id="msgs" style="display:flex;flex-direction:column;gap:10px">${(msgs||[]).map(msgHTML).join('')||'<p class="small muted" id="nomsg">Say something nice. Then go say it in person.</p>'}</div>
    <p class="small muted" style="text-align:center">Tap a message to react or reply</p>
    <div id="rbar" class="row between" hidden style="background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px"><p class="small" id="rtext" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></p><button class="back small" id="rx" aria-label="Cancel reply">✕</button></div>
    <div class="row"><input type="text" id="tx" maxlength="1000" placeholder="Message"><button class="btn sm violet" id="sd">Send</button></div>
    <button class="btn" id="bl" style="color:var(--red)">Block or report</button>
  </div>`;
  document.getElementById('bk').onclick=()=>setTab('chats');
  const kp=document.getElementById('kp');
  const kpState=c=>{ if(!c) return; const mine=c.user_a===S.user.id?c.kept_a:c.kept_b, both=c.kept_a&&c.kept_b;
    kp.textContent = both?'Friends ✓':mine?'Request sent':'Add friend'; kp.disabled = mine||both; if(both) kp.className='btn sm'; };
  SB.from('connections').select('user_a,user_b,kept_a,kept_b').eq('id',cid).maybeSingle().then(async({data})=>{ kpState(data); if(!data) return;
    const other=data.user_a===S.user.id?data.user_b:data.user_a;
    SB.rpc('friend_profile',{ other }).then(({data:fp})=>{ const f=(fp||[])[0], hd=document.getElementById('chd'); if(!f||!hd) return;
      hd.innerHTML=`${av(f.avatar_icon,f.avatar_color,44,'c:'+cid)}<div style="flex:1;text-align:left"><p style="font-weight:600">${esc(f.first_name||'')} <span class="small muted">@${esc(f.handle)}</span>${f.verified?' <span style="color:var(--green)">✓</span>':''}</p><p class="small" style="color:var(--violet)">Tap to see their Living Room ›</p></div>`; hd.hidden=false;
      hd.onclick=()=>openFriend(other, ()=>openChat(cid)); });
    const { data:paths } = await SB.rpc('their_photos',{ other }); const urls=await signedUrls(paths||[]);
    const box=document.getElementById('cph'); if(!box||!(paths||[]).length) return;
    box.innerHTML=paths.filter(x=>urls[x]).map(x=>`<button data-u="${esc(urls[x])}" data-path="${esc(x)}" style="all:unset;cursor:pointer;flex-shrink:0;width:72px;height:90px;border-radius:10px;overflow:hidden"><img src="${esc(urls[x])}" alt="Their photo" style="width:100%;height:100%;object-fit:cover"></button>`).join(''); box.hidden=false;
    box.querySelectorAll('button').forEach(b=>b.onclick=()=>photoViewer(b.dataset.u, b.dataset.path)); });
  kp.onclick=async()=>{ const { error } = await SB.rpc('keep_connection',{ cid }); if(error) return toast(error.message);
    const { data } = await SB.from('connections').select('user_a,kept_a,kept_b').eq('id',cid).maybeSingle(); kpState(data);
    toast(data&&data.kept_a&&data.kept_b ? "You're friends now. This chat stays." : "Friend request sent. You'll be friends when they add you too."); };
  const box=document.getElementById('msgs');
  const addMsg=m=>{ if(!document.body.contains(box) || box.querySelector(`[data-id="${m.id}"]`)) return; document.getElementById('nomsg')?.remove();
    M.set(m.id,m); box.insertAdjacentHTML('beforeend', msgHTML(m)); box.lastElementChild.scrollIntoView({block:'end',behavior:'smooth'}); };
  const redraw=id=>{ const el=box.querySelector(`.msg[data-id="${id}"]`), m=M.get(id); if(el&&m){ const open=!!el.querySelector('.mbar'); el.outerHTML=msgHTML(m); if(open) openBar(id); } };
  const setReact=(id,u,e)=>{ if(!R.has(id)) R.set(id,new Map()); if(e) R.get(id).set(u,e); else R.get(id).delete(u); redraw(id); };
  const openBar=id=>{ box.querySelectorAll('.mbar').forEach(x=>x.remove()); const el=box.querySelector(`.msg[data-id="${id}"]`); if(!el) return;
    el.insertAdjacentHTML('beforeend', `<div class="mbar">${REACTS.map(e=>`<button data-r="${e}" aria-label="React ${e}">${e}</button>`).join('')}<button class="rp" data-reply="1">↩ Reply</button></div>`); };
  box.onclick=async e=>{ const msgEl=e.target.closest('.msg'); if(!msgEl) return; const id=msgEl.dataset.id;
    const rb=e.target.closest('[data-r]'), rp=e.target.closest('[data-reply]');
    if(rp){ replyTo=id; document.getElementById('rtext').textContent='↩ Replying to: '+snip(M.get(id)?.body); document.getElementById('rbar').hidden=false; msgEl.querySelector('.mbar')?.remove(); document.getElementById('tx').focus(); return; }
    if(rb){ const emo=rb.dataset.r, mine=R.get(id)?.get(S.user.id); msgEl.querySelector('.mbar')?.remove();
      if(mine===emo){ setReact(id,S.user.id,null); const { error } = await SB.from('message_reactions').delete().eq('message_id',id).eq('user_id',S.user.id); if(error){ setReact(id,S.user.id,mine); toast(error.message); } }
      else { setReact(id,S.user.id,emo); const { error } = await SB.from('message_reactions').upsert({ message_id:id, user_id:S.user.id, connection_id:cid, emoji:emo }); if(error){ setReact(id,S.user.id,mine||null); toast(error.message); } }
      return; }
    if(e.target.closest('.bubble')){ if(msgEl.querySelector('.mbar')) msgEl.querySelector('.mbar').remove(); else openBar(id); } };
  document.getElementById('rx').onclick=()=>{ replyTo=null; document.getElementById('rbar').hidden=true; };
  box.lastElementChild?.scrollIntoView({block:'end'});
  SB.rpc('mark_read',{ cid }).then(refreshBadges);
  if(S.chan) SB.removeChannel(S.chan);
  S.chan = SB.channel('chat-'+cid)
    .on('postgres_changes',{ event:'INSERT', schema:'public', table:'messages', filter:'connection_id=eq.'+cid }, p=>{ addMsg(p.new); if(p.new.sender!==S.user.id) SB.rpc('mark_read',{ cid }); })
    .on('postgres_changes',{ event:'*', schema:'public', table:'message_reactions', filter:'connection_id=eq.'+cid }, p=>{ const r=p.eventType==='DELETE'?p.old:p.new; if(!r||!r.message_id||r.user_id===S.user.id) return; setReact(r.message_id, r.user_id, p.eventType==='DELETE'?null:r.emoji); })
    .subscribe();
  const send=async()=>{ const tx=document.getElementById('tx'); const body=tx.value.trim(); if(!body) return; tx.value=''; const rt=replyTo; replyTo=null; document.getElementById('rbar').hidden=true;
    const { data, error } = await SB.from('messages').insert({ connection_id:cid, sender:S.user.id, body, reply_to:rt }).select().single(); if(error){ tx.value=body; return toast(error.message); } addMsg(data); tx.focus(); };
  document.getElementById('sd').onclick=send; document.getElementById('tx').onkeydown=e=>{ if(e.key==='Enter') send(); };
  document.getElementById('bl').onclick=async()=>{
    const { data:c } = await SB.from('connections').select('user_a,user_b').eq('id',cid).single(); const other = c.user_a===S.user.id?c.user_b:c.user_a;
    const reason = prompt('Tell us what happened (optional). They will be blocked either way.') ;
    if(reason===null) return;
    await SB.from('blocks').insert({ blocker:S.user.id, blocked:other });
    await SB.from('reports').insert({ reporter:S.user.id, reported:other, reason:'chat', details:reason||null });
    toast('Blocked. Thanks for telling us.'); setTab('chats');
  };
}

      :'<p class="muted">No friends to add yet. Add friends by handle in Chats, or tap Add friend in a chat.</p>'}
    <p class="err" data-err></p><button class="btn violet" data-ok>${esc(okText||'Done')}</button></div>`;

  d.querySelector('[data-ok]').onclick=()=>{ const nm=d.querySelector('#gnm'); if(nm && nm.value.trim().length<1){ d.querySelector('[data-err]').textContent='Give the group a name.'; return; }
    if(nm && !sel.size){ d.querySelector('[data-err]').textContent='Pick at least one friend.'; return; } close({ ids:[...sel], name:nm?nm.value.trim():null }); };
}); }

  const setReact=(id,u,e)=>{ if(!R.has(id)) R.set(id,new Map()); if(e) R.get(id).set(u,e); else R.get(id).delete(u); redraw(id); };
  const openBar=id=>{ box.querySelectorAll('.mbar').forEach(x=>x.remove()); const el=box.querySelector(`.msg[data-id="${id}"]`); if(!el) return;
    el.insertAdjacentHTML('beforeend', `<div class="mbar">${REACTS.map(e=>`<button data-r="${e}" aria-label="React ${e}">${e}</button>`).join('')}<button class="rp" data-reply="1">↩ Reply</button></div>`); };

    if(rb){ const emo=rb.dataset.r, mine=R.get(id)?.get(S.user.id); msgEl.querySelector('.mbar')?.remove();
      if(mine===emo){ setReact(id,S.user.id,null); const { error } = await SB.from('group_reactions').delete().eq('message_id',id).eq('user_id',S.user.id); if(error){ setReact(id,S.user.id,mine); toast(error.message); } }
      else { setReact(id,S.user.id,emo); const { error } = await SB.from('group_reactions').upsert({ message_id:id, user_id:S.user.id, group_id:gid, emoji:emo }); if(error){ setReact(id,S.user.id,mine||null); toast(error.message); } }

  document.getElementById('rx').onclick=()=>{ replyTo=null; document.getElementById('rbar').hidden=true; };
  box.lastElementChild?.scrollIntoView({block:'end'});
  SB.rpc('mark_group_read',{ gid }).then(refreshBadges);
  if(S.chan) SB.removeChannel(S.chan);
  S.chan = SB.channel('group-'+gid)
    .on('postgres_changes',{ event:'INSERT', schema:'public', table:'group_messages', filter:'group_id=eq.'+gid }, p=>{ addMsg(p.new); if(p.new.sender!==S.user.id) SB.rpc('mark_group_read',{ gid }); })
    .on('postgres_changes',{ event:'*', schema:'public', table:'group_reactions', filter:'group_id=eq.'+gid }, p=>{ const r=p.eventType==='DELETE'?p.old:p.new; if(!r||!r.message_id||r.user_id===S.user.id) return; setReact(r.message_id, r.user_id, p.eventType==='DELETE'?null:r.emoji); })
    .subscribe();
  const send=async()=>{ const tx=document.getElementById('tx'); const body=tx.value.trim(); if(!body) return; tx.value=''; const rt=replyTo; replyTo=null; document.getElementById('rbar').hidden=true;
    const { data, error } = await SB.from('group_messages').insert({ group_id:gid, sender:S.user.id, body, reply_to:rt }).select().single(); if(error){ tx.value=body; return toast(error.message); } addMsg(data); tx.focus(); };
  document.getElementById('sd').onclick=send; document.getElementById('tx').onkeydown=e=>{ if(e.key==='Enter') send(); };
}

function pendingJoin(){ try{ return JSON.parse(lsGet('mirl_join')||'null'); }catch{ return null; } }
async function handleJoin(){
  const j=pendingJoin(); if(!j||!S.user||!S.profile||!S.profile.handle) return;
  lsSet('mirl_join',null);
  const { data:pid, error } = await SB.rpc('accept_plan_link',{ code:j.code, by_handle:j.by||'' });
  if(error) return toast(/expired/.test(error.message)?'That plan already happened':'That invite link is not valid');
  toast(j.by&&j.by!==S.profile.handle?`You're going! 🎉 We told @${j.by}. Your plan chat is open, so say hi before you get there.`:"You're going! 🎉"); refreshBadges(); openPlan(pid);

function sharePlan(p){ const link=`${location.origin}/app/#join=${p.invite_code}&by=${encodeURIComponent(S.profile.handle||'')}`;
  const w=when(p.starts_at), text=`Come with me! 🎉 ${p.title} at ${p.venues?.name||'the spot'}, ${w.day[0]+w.day.slice(1).toLowerCase()} ${w.time}. RSVP here: ${link}`;
  if(navigator.share) return navigator.share({ title:p.title, text }).catch(()=>{});
  navigator.clipboard.writeText(text).then(()=>toast('Invite copied. Paste it in a text or DM.')).catch(()=>prompt('Copy your invite', text)); }
