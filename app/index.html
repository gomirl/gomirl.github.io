<style>
:root{--bg:#12101C;--surface:#1D1A2B;--surface2:#272338;--line:#2F2A44;--ink:#F4F1FA;--muted:#B4ADC8;--gold:#DCD03A;--violet:#7B78FF;--green:#45BE85;--red:#FF8A7A;

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.screen{flex:1;padding:max(24px,env(safe-area-inset-top)) 20px 110px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:700;font-size:28px;margin:0;line-height:1.05}
h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}
p{margin:0;line-height:1.45}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:25px;border:1px solid var(--line);background:transparent;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);width:100%}
.btn.gold{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.btn.violet{background:var(--violet);color:var(--bg);border-color:var(--violet)}
.btn.white{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{min-height:40px;width:auto;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:grid;gap:6px;font-size:13px;color:var(--muted)}
input[type=text],input[type=date],input[type=datetime-local],input[type=number],select,textarea{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 12px;color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button,.chip{min-height:44px;border-radius:22px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:14px;cursor:pointer;padding:0 10px}
.seg button[aria-pressed=true]{background:var(--violet);border-color:var(--violet);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;font-weight:500}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.switch{width:52px;height:30px;flex-shrink:0;border-radius:15px;border:none;padding:3px;cursor:pointer;display:flex;background:#3A3452}
.switch::after{content:"";width:24px;height:24px;border-radius:50%;background:var(--bg)}
.switch[aria-checked=true]{background:var(--gold);justify-content:flex-end}
.avatar{width:48px;height:48px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font:700 18px var(--display);color:var(--bg);background:var(--violet);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:#171424;border-top:1px solid var(--line);padding:8px 8px max(14px,env(safe-area-inset-bottom));z-index:1000}
[hidden]{display:none!important}
nav.tabs .in{max-width:480px;width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.tabs button{background:none;border:none;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:48px;justify-content:center;cursor:pointer}

nav.tabs svg{width:22px;height:22px}
nav.tabs button{position:relative}
nav.tabs .bdg{position:absolute;top:2px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:9px;font:700 11px/18px var(--body);min-width:18px;height:18px;padding:0 5px;text-align:center}
.ubdg{background:var(--red);color:#fff;border-radius:10px;font:700 12px/20px var(--body);min-width:20px;height:20px;padding:0 6px;text-align:center;flex-shrink:0}

.leaflet-container{background:#1A1727;font-family:var(--body)}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9) saturate(.6)}

.pin.hot{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.pin.warm{background:var(--violet);color:var(--bg);border-color:var(--violet)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.date{display:flex;flex-direction:column;align-items:center;width:44px;color:var(--gold);flex-shrink:0}
.date b{font-family:var(--display);font-size:20px}
.date span{font-size:11px;font-weight:600}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-weight:600;font-size:14px;z-index:2000;max-width:90vw;text-align:center}
.err{color:var(--red);font-size:13px;min-height:1em}
.back{background:none;border:none;color:var(--muted);padding:0;cursor:pointer;font-size:14px;text-align:left}
.bubble{max-width:80%;padding:10px 14px;border-radius:18px;background:var(--surface2);align-self:flex-start;line-height:1.35}
.bubble.me{background:var(--violet);color:var(--bg);align-self:flex-end}
.msg{display:flex;flex-direction:column;align-items:flex-start}
html.locked #app,html.locked nav.tabs{visibility:hidden}
.pinpad{position:fixed;inset:0;z-index:5000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.pinpad .dots{display:flex;gap:14px;margin:6px 0}
.pinpad .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pinpad .dots i.on{background:var(--ink);border-color:var(--ink)}
.pinpad .keys{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pinpad .keys button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 26px var(--display);cursor:pointer}
.pinpad .keys button.blank{visibility:hidden}
.pinpad .shake{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.decoy{position:fixed;inset:0;z-index:4500;background:#F7F7F5;color:#222;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 18px 18px;font-family:-apple-system,system-ui,sans-serif}

.msg.me{align-items:flex-end}
.msg .bubble{align-self:auto;cursor:pointer;-webkit-user-select:none;user-select:none}
.quote{font-size:12px;color:var(--muted);border-left:3px solid var(--violet);padding:2px 8px;margin:0 4px 3px;max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.logo{font-family:var(--display);font-weight:700;font-size:44px;letter-spacing:-.02em;background:linear-gradient(90deg,#5E66FF,#8A2BFF);-webkit-background-clip:text;color:transparent}

    d.innerHTML=`<p style="font-weight:600">Drag to move · pinch or slide to zoom</p>
      <div id="cf" style="position:relative;width:${W}px;height:${H}px;overflow:hidden;border-radius:16px;touch-action:none;background:#000;cursor:grab">
        <img src="${url}" alt="" draggable="false" style="position:absolute;left:50%;top:50%;max-width:none;user-select:none;-webkit-user-drag:none">

      <div class="row" style="gap:10px;width:${W}px"><button class="btn" id="cx" style="flex:1">Cancel</button><button class="btn gold" id="cok" style="flex:1">Use photo</button></div>`;
    document.body.appendChild(d);
    const im=d.querySelector('img'), frame=d.querySelector('#cf'), zr=d.querySelector('#cz');

    const hc=await checkHandle(); if(hc.err) return err.textContent=hc.err;
    if(!document.getElementById('terms').checked) return err.textContent='Please check the box to continue.';
    const show=document.getElementById('show').value;
    const GROUPS={ w:['woman','trans woman'], m:['man','trans man'], nb:['nonbinary','genderfluid'] };
    const showG = show ? show.split(',').flatMap(k=>GROUPS[k]) : [];
    let g=document.getElementById('gender').value;
    if(g==='self') g=document.getElementById('gself').value.trim().toLowerCase()||null;
    if(g==='private') g=null;
    const row={ id:S.user.id, first_name:fn, birth_date:bd, mode:st.mode, gender:g||null, handle:hc.h, avatar_icon:st.icon, avatar_color:st.color,
      show_genders: showG, interests:Object.keys(st.picked).filter(k=>st.picked[k]), avatar_url: meta.avatar_url||meta.picture||null };
    const { error } = await SB.from('profiles').insert(row);
    if(error) return err.textContent = error.message.includes('account_not_allowed') ? "This account can't use MIRL. Questions: hello@gomirl.com" : error.message.includes('birth_date') ? 'MIRL is 18+ only.' : 'Could not save: '+error.message;
    toast('Welcome to MIRL'); loadProfile();
  };
}

// ---------- map ----------
async function renderMap(){
  let view=null; try{ view=JSON.parse(localStorage.getItem('mirl_view')||'null'); }catch{}
  const DELRAY=[26.4616,-80.0685];
  $app.innerHTML = `<div class="screen">
    <div class="row between"><div><p class="small muted" id="area">Near you</p><h1>Tonight</h1></div>

      <div id="map" role="region" aria-label="Map of spots"></div>
      <div id="xhair" hidden style="position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border:3px solid var(--gold);border-radius:50%;z-index:900;pointer-events:none;box-shadow:0 0 0 3px rgba(0,0,0,.4)"></div>
      <button class="btn sm" id="nearme" style="position:absolute;right:10px;bottom:10px;z-index:900;background:var(--surface);width:auto">📍 Near me</button>

  const glow=L.layerGroup().addTo(S.map), layer=L.layerGroup().addTo(S.map);
  S.osmCache = S.osmCache || {};
  let tmr, seq=0;
  const load=async()=>{
    const my=++seq, b=S.map.getBounds(), z=S.map.getZoom(), c=S.map.getCenter();

    document.getElementById('area').textContent = inDelray ? 'Atlantic Ave · Delray Beach · launch zone' : 'Near you';
    const box={ s:b.getSouth(), w:b.getWest(), n:b.getNorth(), e:b.getEast() };
    const [{ data:dbv }, { data:feat }, { data:fc }, { data:act }] = await Promise.all([SB.rpc('venue_counts_area',box), SB.rpc('featured_plan_area',box), SB.rpc('friend_counts'), SB.rpc('area_activity',box)]);
    if(my!==seq) return;
    glow.clearLayers();
    (act||[]).forEach(a=>{ const n=a.people, lab=n>=20?'20+':n>=10?'10+':n>=5?'5+':'3+';
      L.circle([a.lat,a.lng],{ radius:190, stroke:false, fillColor:'#7B78FF', fillOpacity:Math.min(.5,.16+n*.02), interactive:true })
        .bindTooltip(lab+' members around', { direction:'top' }).addTo(glow); });
    const FC={}; (fc||[]).forEach(r=>FC[r.venue_id]=r.friends_here);
    let list=(dbv||[]).map(v=>({...v, friends_here:FC[v.venue_id]||0}));
    const sortL=l=>l.sort((a,b)=>(b.members_here||0)-(a.members_here||0) || (b.friends_here||0)-(a.friends_here||0) || a.name.localeCompare(b.name));
    sortL(list); S.venues=list;
    const draw=list=>{
      if(!document.getElementById('vlist')) return;
      const featEl=document.getElementById('feat');
    if(feat && feat[0]){ const f=feat[0], w=when(f.starts_at);
      featEl.innerHTML=`<button class="item" style="background:var(--gold);color:var(--bg);border-color:var(--gold)" id="featb">

      document.getElementById('featb').onclick=()=>openPlan(f.plan_id);
    } else featEl.innerHTML='';
    layer.clearLayers();
    list.forEach((v,i)=>{
      const n=v.members_here, cls=n>=15?'pin hot':n>=5?'pin warm':'pin';
      const icon=L.divIcon({className:'',html:`<div class="${cls}">${n?n+' · ':''}${esc(v.name)}${v.friends_here?' · 👥'+v.friends_here:''}</div>`,iconSize:null});
      L.marker([v.lat,v.lng],{icon}).addTo(layer).on('click',()=>goVenue(v));
    });
    const vl=document.getElementById('vlist');
    vl.innerHTML = list.length ? list.slice(0,60).map((v,i)=>`<button class="item" data-i="${i}">
       <div style="flex:1"><p style="font-weight:600">${esc(v.name)}</p>${v.category?`<p class="small muted">${esc(v.category)}</p>`:''}</div>
       <span class="small ${v.members_here?'':'muted'}">${v.members_here?v.members_here+' here':'Quiet'}${v.friends_here?` · <b style="color:var(--green)">${v.friends_here} friend${v.friends_here>1?'s':''}</b>`:''}</span></button>`).join('')
      : `<p class="small muted">${z<15?'Zoom in to see spots.':'No spots here yet. Add one below the map.'}</p>`;
    vl.querySelectorAll('.item').forEach(b=>b.onclick=()=>goVenue(list[+b.dataset.i]));
      };
    draw(list);
    // OpenStreetMap places not saved yet, loaded in the background (zoomed in only)
    if(z>=15){
      const key=[box.s,box.w,box.n,box.e].map(x=>x.toFixed(3)).join(',');
      let osm=S.osmCache[key];
      if(!osm){
        const q=`[out:json][timeout:12];(nwr["amenity"~"^(bar|pub|nightclub|restaurant|cafe|biergarten)$"]["name"](${box.s},${box.w},${box.n},${box.e}););out center 300;`;
        const ask=host=>{ const ctl=new AbortController(); setTimeout(()=>ctl.abort(),15000);
          return fetch(host,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctl.signal})
            .then(r=>r.ok?r.json():Promise.reject(r.status)).then(j=>j.elements?j:Promise.reject('bad')); };
        try{ const j=await Promise.any(['https://overpass.private.coffee/api/interpreter','https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'].map(ask));
          osm=(j.elements||[]).map(x=>({ osm_id:x.type[0]+x.id, name:x.tags.name, category:x.tags.amenity, address:[x.tags['addr:housenumber'],x.tags['addr:street']].filter(Boolean).join(' ')||null, lat:x.lat??x.center?.lat, lng:x.lon??x.center?.lon })).filter(x=>x.lat&&x.lng);
          S.osmCache[key]=osm; }catch{}
      }
      if(my!==seq || !osm) return;
      const have=new Set(list.map(v=>v.osm_id).filter(Boolean));
      const more=osm.filter(o=>!have.has(o.osm_id)).map(o=>({...o, venue_id:null, members_here:null, friends_here:0, is_public:true}));
      if(more.length){ list=sortL(list.concat(more)); S.venues=list; draw(list); }
    }
  };
  S.map.on('moveend',()=>{ clearTimeout(tmr); tmr=setTimeout(load,350); });
  load();
  document.getElementById('nearme').onclick=()=>{
    if(!navigator.geolocation) return toast('Location is not available on this device.');
    navigator.geolocation.getCurrentPosition(p=>{ pingArea(p); S.map.setView([p.coords.latitude,p.coords.longitude],16); }, ()=>toast('Allow location to center the map. It stays on your phone.'), { timeout:10000 });
  };
  // add a missing spot
  document.getElementById('addspot').onclick=()=>{
    if(S.map.getZoom()<16) S.map.setZoom(17);
    document.getElementById('xhair').hidden=false; document.getElementById('addspot').hidden=true;
    const box=document.getElementById('addbox');
    box.innerHTML=`<div class="card" style="display:flex;flex-direction:column;gap:10px">
      <p style="font-weight:600">Move the map so the gold circle is on the spot</p>
      <label class="f">Name<input type="text" id="an" maxlength="80" placeholder="e.g. Joe's Tiki Bar"></label>
      <label class="f">Type<select id="ac"><option value="bar">Bar</option><option value="restaurant">Restaurant</option><option value="nightclub">Club</option><option value="cafe">Cafe</option><option value="event_space">Event space</option><option value="other">Other public place</option></select></label>
      <div id="near"></div><div class="err" id="aerr"></div>
      <div class="row"><button class="btn" id="acancel">Cancel</button><button class="btn gold" id="asave">Add spot</button></div>
      <p class="small muted">Public places only. New spots work for check-ins right away; plans open once we review them.</p></div>`;
    const close=()=>{ box.innerHTML=''; document.getElementById('xhair').hidden=true; document.getElementById('addspot').hidden=false; };
    document.getElementById('acancel').onclick=close;
    let confirmed=false;
    document.getElementById('asave').onclick=async()=>{
      const name=document.getElementById('an').value.trim(), cat=document.getElementById('ac').value, c=S.map.getCenter(), err=document.getElementById('aerr');
      if(name.length<2) return err.textContent='Give the spot a name.';
      if(!confirmed){
        const { data:nb } = await SB.rpc('venues_near',{ p_lat:c.lat, p_lng:c.lng });
        const osmNear=(S.venues||[]).filter(v=>!v.venue_id && dist(c.lat,c.lng,v.lat,v.lng)<=100).map(v=>({ name:v.name, meters:Math.round(dist(c.lat,c.lng,v.lat,v.lng)), v }));
        const all=[...(nb||[]).map(x=>({ name:x.name, meters:x.meters, id:x.venue_id })), ...osmNear].sort((a,b)=>a.meters-b.meters).slice(0,6);
        if(all.length){ confirmed=true;
          document.getElementById('near').innerHTML=`<p class="small" style="font-weight:600">Is it one of these?</p><div class="list" style="margin-top:6px">${all.map((x,i)=>`<button class="item" data-k="${i}"><div style="flex:1">${esc(x.name)}</div><span class="small muted">${x.meters} m</span></button>`).join('')}</div><p class="small muted" style="margin-top:6px">Not listed? Tap Add spot again.</p>`;
          document.querySelectorAll('#near .item').forEach(b=>b.onclick=()=>{ const x=all[+b.dataset.k]; close(); x.id?openVenue(x.id):goVenue(x.v); });
          return; }
      }
      const { data:id, error } = await SB.rpc('add_venue',{ p_name:name, p_cat:cat, p_lat:c.lat, p_lng:c.lng });
      if(error) return err.textContent=error.message;
      close(); toast('Spot added'); S.osmCache={}; await load(); openVenue(id);
    };
  };
}
async function goVenue(v){
  if(!v.venue_id){
    const { data:id, error } = await SB.rpc('save_osm_venue',{ p_osm:v.osm_id, p_name:v.name, p_cat:v.category||null, p_addr:v.address||null, p_lat:v.lat, p_lng:v.lng });
    if(error) return toast('Could not open this spot');
    v.venue_id=id;
  }
  openVenue(v.venue_id);
}

async function openVenue(id){
  const v = S.venues.find(x=>x.venue_id===id) || (await SB.from('venues').select('id,name,lat,lng,is_public').eq('id',id).single()).data;
  const vid = v.venue_id||v.id;
  const now=new Date(), wk=new Date(Date.now()+7*864e5);
  const { data:plans } = await SB.from('plans').select('id,title,starts_at,visibility').eq('venue_id',vid).gte('starts_at', new Date(Date.now()-6*36e5).toISOString()).lte('starts_at',wk.toISOString()).order('starts_at');
  document.getElementById('tabs').hidden=false;
  $app.innerHTML = `<div class="screen">
    <button class="back" id="bk">‹ Back to map</button>
    <h1>${esc(v.name)}</h1>
    <div class="card"><p style="font-family:var(--display);font-size:30px;font-weight:700;color:var(--gold)">${v.members_here||0}</p><p class="small muted">members inside now${v.friends_here?` · <b style="color:var(--green)">${v.friends_here} of your friends</b>`:''}</p></div>
    <button class="btn gold" id="ci">I'm here · check in</button>
    <p class="small muted">Uses your location once, only to confirm you're at ${esc(v.name)}. You're checked out when you leave or after 3 hours.</p>
    <div class="err" id="err"></div>
    <h2>Plans here this week</h2>
    <div class="list" id="pl">${(plans||[]).length? plans.map(p=>{const w=when(p.starts_at); return `<button class="item" data-id="${p.id}"><div class="date"><span>${w.day}</span><b>${w.time}</b></div><div style="flex:1"><p style="font-weight:600">${esc(p.title)}</p><p class="small muted">${p.visibility==='open'?'Open':'Invite-only'}</p></div></button>`}).join('') : '<p class="small muted">No plans yet. Start one.</p>'}</div>
    ${v.is_public===false?'<p class="small muted">New spot added by a member. Plans open here once it\'s reviewed.</p>':'<button class="btn" id="np">+ Start a plan here</button>'}
    <p class="small muted">Listing from public map data. Own ${esc(v.name)}? Email hello@gomirl.com to claim it free.</p>
  </div>`;
  document.getElementById('bk').onclick=()=>setTab('map');
  const npb=document.getElementById('np'); if(npb) npb.onclick=()=>newPlan(vid, v.name);
  document.querySelectorAll('#pl .item').forEach(b=>b.onclick=()=>openPlan(b.dataset.id));
  document.getElementById('ci').onclick=()=>{
    const err=document.getElementById('err'); err.textContent='Checking your location…';
    if(!navigator.geolocation) return err.textContent='Location is not available on this device.';
    const iOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
    const fail=e=>{
      if(e.code===1) err.innerHTML = iOS
        ? 'Location is blocked for this browser. On iPhone: <b>Settings → Privacy & Security → Location Services</b> (on) → <b>Safari Websites</b> (or Chrome) → <b>While Using</b>. Then reload this page and tap check in again.'
        : 'Location is blocked. Tap the lock icon by the web address, allow Location, then tap check in again.';
      else err.textContent='Could not get your location (weak signal indoors?). Step near a door or window and tap check in again.';
    };
    const go=async pos=>{
      pingArea(pos);
      const d=dist(pos.coords.latitude,pos.coords.longitude,v.lat,v.lng);
      const acc=pos.coords.accuracy||0, allowed=Math.min(250, CHECKIN_RADIUS_M + Math.min(acc,150));
      if(d > allowed) return err.textContent = acc>150
        ? `Your GPS is weak in here (about ${Math.round(acc)} m off). Step outside or near the door for a few seconds and tap check in again.`
        : `You look about ${Math.round(d)} m away. Check in once you're there.`;
      const { error } = await SB.rpc('check_in',{ venue: vid, p_lat:pos.coords.latitude, p_lng:pos.coords.longitude, p_acc:acc });
      if(error) return err.textContent = /too_far/.test(error.message) ? 'You look a little too far away. Step inside or near the door and tap check in again.' : 'Could not check in: '+error.message;
      err.textContent=''; toast('Checked in'); openInside(vid, v.name, v.lat, v.lng);
    };
    navigator.geolocation.getCurrentPosition(go, e=>{
      if(e.code===1) return fail(e);
      navigator.geolocation.getCurrentPosition(go, fail, { enableHighAccuracy:false, timeout:20000, maximumAge:120000 });  // retry, faster/coarser
    }, { enableHighAccuracy:true, timeout:12000, maximumAge:60000 });
  };
}

function newPlan(vid, vname){
  const def=new Date(Date.now()+864e5); def.setHours(21,0,0,0);
  const local=new Date(def-def.getTimezoneOffset()*6e4).toISOString().slice(0,16);
  let vis='open';
  $app.innerHTML = `<div class="screen">
    <button class="back" id="bk">‹ Back</button>

    ${vid?`<p class="muted">at ${esc(vname)}</p>`:`<label class="f">Where<input type="text" id="vq" autocomplete="off" placeholder="Start typing a bar, restaurant, park…"></label>
      <div class="list" id="vsug" style="gap:6px;margin-top:-6px"></div><p class="small" id="vpick" style="color:var(--green)"></p>`}
    <label class="f">What<input type="text" id="ti" maxlength="80" placeholder="Salsa night, beginners welcome"></label>
    <label class="f">When<input type="datetime-local" id="wh" value="${local}"></label>
    <div class="seg" style="grid-template-columns:1fr 1fr" id="vis"><button aria-pressed="true" data-v="open">Open to members</button><button aria-pressed="false" data-v="invite">Invite-only</button></div>
    <p class="small muted" id="vnote">Shows on the map to members who fit your settings.</p>
    <div id="tagw" hidden><p style="font-weight:600;margin-bottom:6px">Tag friends <span class="small muted" style="font-weight:400">· they get an invite</span></p><div class="chips" id="tagf"></div></div>
    <div class="err" id="err"></div>
    <button class="btn violet" id="go">Post plan</button>
    <p class="small muted">Public venues only. Hosts follow the same 18+, block and report rules.</p>
  </div>`;
  document.getElementById('bk').onclick=()=> vid?openVenue(vid):setTab('plans');
  let picked=null;
  if(!vid){
    let view=null; try{ view=JSON.parse(localStorage.getItem('mirl_view')||'null'); }catch{}
    const lat=view?.lat||26.4616, lng=view?.lng||-80.0685;
    const vq=document.getElementById('vq'), sug=document.getElementById('vsug'), vp=document.getElementById('vpick'); let tmr, seq=0;
    const show=items=>{ sug.innerHTML=items.map((v,i)=>`<button class="item" data-i="${i}" style="padding:10px 12px"><div style="flex:1;min-width:0"><p style="font-weight:600">${esc(v.name)}</p><p class="small muted">${esc([v.category,v.address].filter(Boolean).join(' · ')||'')}</p></div>${v.venue_id?'<span class="small" style="color:var(--violet)">On MIRL</span>':''}</button>`).join('');
      sug.querySelectorAll('.item').forEach(b=>b.onclick=()=>{ picked=items[+b.dataset.i]; vq.value=picked.name; sug.innerHTML=''; vp.textContent='📍 '+picked.name+(picked.address?' · '+picked.address:''); }); };
    const nearby=(S.venues||[]).filter(v=>v.is_public!==false).slice(0,5); if(nearby.length) show(nearby);
    vq.oninput=()=>{ picked=null; vp.textContent=''; clearTimeout(tmr); const q=vq.value.trim(); if(q.length<2){ show(nearby); return; }
      tmr=setTimeout(async()=>{ const my=++seq;
        const [loc, osm] = await Promise.all([
          SB.rpc('search_venues',{ q, p_lat:lat, p_lng:lng }).then(r=>(r.data||[]).map(v=>({ venue_id:v.id, osm_id:v.osm_id, name:v.name, category:v.category, address:v.address, lat:v.lat, lng:v.lng }))).catch(()=>[]),
          q.length<3 ? Promise.resolve([]) : fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lat=${lat}&lon=${lng}&limit=8&lang=en`).then(r=>r.json()).then(j=>(j.features||[])
            .filter(f=>f.properties.name && /^(amenity|leisure|tourism|shop|club|sport)$/.test(f.properties.osm_key))
            .map(f=>({ venue_id:null, osm_id:String(f.properties.osm_type||'n').toLowerCase()[0]+f.properties.osm_id, name:f.properties.name, category:(f.properties.osm_value||'').replace(/_/g,' '),

        ]);

        const have=new Set(loc.map(v=>v.osm_id).filter(Boolean)), out=loc.concat(osm.filter(o=>!have.has(o.osm_id) && !loc.some(l=>l.name.toLowerCase()===o.name.toLowerCase() && Math.abs(l.lat-o.lat)<0.001 && Math.abs(l.lng-o.lng)<0.001))).slice(0,8);

      else { setReact(id,S.user.id,emo); const { error } = await SB.from('message_reactions').upsert({ message_id:id, user_id:S.user.id, connection_id:cid, emoji:emo }); if(error){ setReact(id,S.user.id,mine||null); toast(error.message); } }
      return; }
    if(e.target.closest('.bubble')){ if(msgEl.querySelector('.mbar')) msgEl.querySelector('.mbar').remove(); else openBar(id); } };

    .on('postgres_changes',{ event:'*', schema:'public', table:'message_reactions', filter:'connection_id=eq.'+cid }, p=>{ const r=p.eventType==='DELETE'?p.old:p.new; if(!r||!r.message_id||r.user_id===S.user.id) return; setReact(r.message_id, r.user_id, p.eventType==='DELETE'?null:r.emoji); })
    .subscribe();
  const send=async()=>{ const tx=document.getElementById('tx'); const body=tx.value.trim(); if(!body) return; tx.value=''; const rt=replyTo; replyTo=null; document.getElementById('rbar').hidden=true;
    const { data, error } = await SB.from('messages').insert({ connection_id:cid, sender:S.user.id, body, reply_to:rt }).select().single(); if(error){ tx.value=body; return toast(error.message); } addMsg(data); tx.focus(); };
  document.getElementById('sd').onclick=send; document.getElementById('tx').onkeydown=e=>{ if(e.key==='Enter') send(); };
  document.getElementById('bl').onclick=async()=>{
    const { data:c } = await SB.from('connections').select('user_a,user_b').eq('id',cid).single(); const other = c.user_a===S.user.id?c.user_b:c.user_a;
    const reason = prompt('Tell us what happened (optional). They will be blocked either way.') ;
    if(reason===null) return;
    await SB.from('blocks').insert({ blocker:S.user.id, blocked:other });
    await SB.from('reports').insert({ reporter:S.user.id, reported:other, reason:'chat', details:reason||null });
    toast('Blocked. Thanks for telling us.'); setTab('chats');
  };
}

function friendPicker(title, skip, okText, extra){ return new Promise(async res=>{

      :'<p class="muted">No friends to add yet. Add friends by handle in Chats, or tap Add friend in a chat.</p>'}
    <p class="err" data-err></p><button class="btn violet" data-ok>${esc(okText||'Done')}</button></div>`;
  document.body.appendChild(d); const close=v=>{ d.remove(); res(v); };
  d.querySelector('[data-x]').onclick=()=>close(null); d.onclick=e=>{ if(e.target===d) close(null); };
  d.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ const id=b.dataset.f, ck=b.querySelector('.ck'); if(sel.has(id)){ sel.delete(id); ck.textContent=''; ck.style.background=''; ck.style.borderColor=''; } else { sel.add(id); ck.textContent='✓'; ck.style.background='var(--violet)'; ck.style.borderColor='var(--violet)'; ck.style.color='var(--bg)'; } });

    if(nm && !sel.size){ d.querySelector('[data-err]').textContent='Pick at least one friend.'; return; } close({ ids:[...sel], name:nm?nm.value.trim():null }); };
}); }

async function openGroup(gid){

    SB.from('group_messages').select('*').eq('group_id',gid).order('created_at').limit(500), SB.from('group_reactions').select('message_id,user_id,emoji').eq('group_id',gid)]);

  const P=new Map((people||[]).map(p=>[p.id,p])), M=new Map((msgs||[]).map(m=>[m.id,m])), R=new Map(); let replyTo=null;

    <div><h1 style="margin-bottom:4px">${g.plan_id?'📅 ':'👥 '}${esc(g.name)}</h1><p class="small muted" id="gpl">${(people||[]).map(p=>p.id===S.user.id?'you':'@'+esc(p.handle)).join(', ')}</p>${g.plan_id?'<p class="small muted">Everyone going is in this chat. It closes a day after the plan.</p>':''}</div>
    <div id="msgs" style="display:flex;flex-direction:column;gap:10px">${all.map((m,i)=>msgHTML(m,all[i-1])).join('')||'<p class="small muted" id="nomsg">Kick it off. Where are we meeting?</p>'}</div>

    .on('postgres_changes',{ event:'*', schema:'public', table:'group_reactions', filter:'group_id=eq.'+gid }, p=>{ const r=p.eventType==='DELETE'?p.old:p.new; if(!r||!r.message_id||r.user_id===S.user.id) return; setReact(r.message_id, r.user_id, p.eventType==='DELETE'?null:r.emoji); })

  document.getElementById('phf').onchange=e=>{ const f=e.target.files[0]; e.target.value=''; if(f) uploadPhoto(f); };
  document.getElementById('cs').onclick=e=>{ casual=!casual; e.currentTarget.setAttribute('aria-checked',casual); document.getElementById('dz').hidden=!casual; };
  document.querySelectorAll('#dchips .chip').forEach(b=>b.onclick=()=>{ const on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',on); dpick[b.textContent]=on; });
  document.getElementById('as').onclick=e=>{ act=!act; e.currentTarget.setAttribute('aria-checked',act); };
  document.getElementById('gs').onclick=e=>{ ghost=!ghost; e.currentTarget.setAttribute('aria-checked',ghost); document.getElementById('gt').textContent='Ghost Mode '+(ghost?'on':'off'); };
  document.getElementById('sv').onclick=async()=>{
    const hc=await checkHandle(); if(hc.err){ const hm=document.getElementById('hdmsg'); hm.textContent=hc.err; hm.style.color='var(--red)'; document.getElementById('hd').scrollIntoView({block:'center'}); document.getElementById('hd').focus(); return; }
    const amin=Math.max(18,+document.getElementById('amin').value||18), amax=Math.max(amin,+document.getElementById('amax').value||99);
    const upd={ mode, interests:Object.keys(picked).filter(k=>picked[k]), orientation:pickVal('or'), relationship_style:pickVal('rs'), show_age_min:amin, show_age_max:Math.min(99,amax), open_to_casual:casual, ghost_mode:ghost, share_activity:act, desires:Object.keys(dpick).filter(k=>dpick[k]), handle:hc.h, avatar_icon:ist.icon, avatar_color:ist.color,
      bio:document.getElementById('bio').value.trim()||null, private_bio:document.getElementById('pbio').value.trim()||null,
      links:links.map(l=>({ label:(l.label||'').trim(), url:(l.url||'').trim() })).filter(l=>l.url).map(l=>({ label:l.label, url:/^https?:\/\//i.test(l.url)?l.url:'https://'+l.url })) };
    const { error } = await SB.from('profiles').update(upd).eq('id',S.user.id);
    if(error) return toast(error.message); if(!act) SB.rpc('ping_area',{ p_lat:0, p_lng:0 }); toast('Saved'); loadProfile();
  };
  document.getElementById('so').onclick=async()=>{ await SB.auth.signOut(); S.user=null; S.profile=null; render(); };
  document.getElementById('del').onclick=async()=>{
    if(!confirm('Delete your MIRL account? Your profile, plans, chats and everything else will be permanently deleted. This cannot be undone.')) return;
    try{ const { data:files } = await SB.storage.from('photos').list(S.user.id,{ limit:100 }); if((files||[]).length) await SB.storage.from('photos').remove(files.map(f=>S.user.id+'/'+f.name)); }catch{}
    const { error } = await SB.rpc('delete_my_account'); if(error) return toast('Could not delete: '+error.message);
    await SB.auth.signOut(); S.user=null; S.profile=null; toast('Your account was deleted'); render(); };
}

// ---------- invite links ----------
async function handleJoin(){
  const m=location.hash.match(/join=([a-f0-9]+)/); if(!m||!S.user||!S.profile) return;
  history.replaceState(null,'',location.pathname);
  const { data, error } = await SB.rpc('join_plan_by_code',{ code:m[1], bring:0 });
  if(error) return toast('That invite link is not valid');
  toast("You're in"); openPlan(data);
}
showLock();
boot().then(handleJoin);
</script>
